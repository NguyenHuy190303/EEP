<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KV cache — manim palette</title>
<style>
/* Palette: ManimCommunity/manim main@5dc0d3b8df (fetched 2026-10-03)
   manim/utils/color/manim_colors.py  — WHITE #FFFFFF, GRAY_C #888888, GRAY_D #444444, YELLOW #F7D96F,
   BLUE #58C4DD, PURPLE_A #CAA3E8, RED #FC6255, GREEN #83C167  (copy in manim_colors.ref.py)
   manim/_config/default.cfg          — background_color = BLACK (#000000) */
html,body{margin:0;background:#000000;overflow:hidden}
svg{display:block;width:1920px;height:1080px}
svg text{font-family:'STIX Two Text','Times New Roman',serif;stroke:none}
svg text.i{font-style:italic}
svg tspan.op{font-family:'STIX Two Math',serif;font-style:normal}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const TL = /*TIMELINE*/;
const C = TL.cues.map(c => c.start);           // start time of each narrated sentence
const COL = {fg:'#FFFFFF', mute:'#888888', line:'#444444', q:'#F7D96F', k:'#58C4DD', v:'#CAA3E8', bad:'#FC6255', ok:'#83C167'};
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };   // manim's smooth-ish
const P = (t, a, d=.5) => ease((t - a) / d);
function T(x, y, s, o={}) {
  return `<text x="${x}" y="${y}" font-size="${o.size||40}" fill="${o.fill||COL.fg}" text-anchor="${o.anchor||'middle'}"`
   + ` opacity="${o.op ?? 1}" ${o.i?'class="i"':''} dominant-baseline="middle">${s}</text>`;
}
const sub = (b, n) => `${b}<tspan font-size="0.65em" dy="0.3em">${n}</tspan>`;
function R(x, y, w, h, o={}) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 6}" fill="${o.fill||'none'}"`
   + ` fill-opacity="${o.fo ?? 1}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||2.5}" opacity="${o.op ?? 1}"/>`;
}
const TOK = ['Paris', 'is', 'the', 'capital', 'of', 'France'];
const tx = i => 960 + (i - 2.5) * 250;

function cell(x, y, col, label, a, flash=0) {
  return R(x, y, 90, 56, {fill:col, fo:.2 + .55*flash, stroke:col, op:a})
       + T(x + 45, y + 30, label, {size:34, fill: flash > .3 ? '#000000' : col, op:a, i:1});
}

function render(t) {
  const o = [];
  // tokens appear one at a time, centred; rise when the comparison starts
  const tokFade = 1 - P(t, C[5], .6), tokY = 470 - 270 * P(t, C[2], .8);
  TOK.forEach((w, i) => {
    const p = P(t, C[0] + i*.33, .45), a = p * tokFade;
    if (a <= 0) return;
    const isQ = i === 5 && t >= C[1];
    o.push(T(tx(i), tokY + (1 - p)*24, w, {size:52, op:a, fill: isQ ? COL.q : COL.fg}));
  });
  // newest token's query reaches back to every earlier key/value
  const f1 = 1 - P(t, C[2], .5);
  if (t >= C[1] && f1 > 0) {
    for (let j = 0; j < 5; j++) {
      const p = ease((t - C[1] - .2 - (4 - j)*.22) / .6);
      const top = tokY - 40, x0 = tx(5) - 30, x1 = tx(j), cy = top - 50 - (5 - j)*24;
      o.push(`<path d="M${x0} ${top} Q ${(x0 + x1)/2} ${cy} ${x1} ${top}" fill="none" stroke="${COL.q}" stroke-width="3"`
        + ` pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}" opacity="${f1}"/>`);
      const kv = P(t, C[1] + 1.6 + j*.15, .4) * f1;
      if (kv > 0) o.push(cell(tx(j) - 95, tokY + 50, COL.k, sub('k', j+1), kv), cell(tx(j) + 5, tokY + 50, COL.v, sub('v', j+1), kv));
    }
  }
  // no cache (recompute every row each step) vs cache (one new row per step)
  const pop = P(t, C[2], .6) * (1 - P(t, C[5], .6));
  if (pop > 0) {
    o.push(`<line x1="960" y1="320" x2="960" y2="1000" stroke="${COL.line}" stroke-width="2" opacity="${pop}"/>`);
    const side = (cx, label, col, start, dur, recompute, lawAt, law) => {
      o.push(T(cx, 330, label, {size:46, fill:col, op:pop}));
      const live = t >= start ? Math.min(6, 1 + Math.floor((t - start) / dur)) : 0;
      let total = 0; for (let s = 1; s <= live; s++) total += recompute ? s : 1;
      for (let j = 0; j < live; j++) {
        const born = start + j*dur, last = start + (live - 1)*dur;
        const flash = recompute ? Math.max(0, 1 - (t - last)/dur) : (j === live - 1 ? Math.max(0, 1 - (t - born)/(dur*1.6)) : 0);
        const a = pop * (recompute ? 1 : P(t, born, .4)), dx = recompute ? 0 : (1 - P(t, born, .4)) * 140;
        const y = 400 + j*72;
        o.push(T(cx - 250, y + 30, TOK[j], {size:34, fill:COL.mute, anchor:'end', op:a}));
        o.push(cell(cx - 210 + dx, y, flash > .05 ? col : COL.k, sub('k', j+1), a, flash),
               cell(cx - 105 + dx, y, flash > .05 ? col : COL.v, sub('v', j+1), a, flash));
      }
      // running total of K,V computations, bars on a shared scale (max 21)
      let cum = 0; const bx = cx + 40, base = 830;
      for (let s = 1; s <= 6; s++) {
        cum += recompute ? s : 1;
        const g = P(t, start + (s - 1)*dur, .35); if (g <= 0) continue;
        const h = cum / 21 * 400 * g;
        o.push(R(bx + (s - 1)*34, base - h, 24, h, {fill:col, fo:.85, rx:2, op:pop}));
      }
      if (live) o.push(T(cx + 125, 900, String(total), {size:64, fill:col, op:pop}));
      const la = P(t, lawAt, .5) * pop;
      if (la > 0) o.push(T(cx - 150, 900, law, {size:56, fill:col, op:la, i:1}));
    };
    side(480, 'no cache', COL.bad, C[2] + .35, .55, true, C[3], '<tspan class="op">∝</tspan> n²');
    side(1440, 'cache', COL.ok, C[4] + .3, .55, false, C[4] + 3.5, '<tspan class="op">∝</tspan> n');
  }
  // memory
  const m = P(t, C[5], .6);
  if (m > 0) {
    o.push(T(960, 170, 'memory', {size:72, op:m}));
    o.push(T(960, 255, 'Llama 3.1 8B', {size:34, fill:COL.mute, op:P(t, C[6], .5)}));
    const terms = [['2','K, V'],['×'],['32','layers'],['×'],['8','KV heads'],['×'],['128','head dim'],['×'],['2 B','bf16'],['='],['128 KiB','per token']];
    const W = [110, 70, 140, 70, 110, 70, 170, 70, 140, 80, 300];
    let x = 960 - W.reduce((a, b) => a + b, 0)/2, k = 0;
    terms.forEach((tm, i) => {
      const cx = x + W[i]/2; x += W[i];
      const at = C[6] + .2 + (tm.length === 2 ? k++ : k - .5) * .55;
      const a = P(t, at, .45); if (a <= 0) return;
      const last = i === terms.length - 1;
      o.push(T(cx, 400 + (1 - a)*36, tm[0], {size:68, op:a, fill: last ? COL.q : COL.fg}));
      if (tm[1]) o.push(T(cx, 470, tm[1], {size:30, fill:COL.mute, op:a}));
    });
    const bar = (y, label, bytes, col, at, grow) => {
      const a = P(t, at, .45), g = P(t, at + .15, grow); if (a <= 0) return;
      o.push(T(160, y, label, {size:38, anchor:'start', op:a}));
      o.push(R(160, y + 30, Math.max(4, bytes / 17.18e9 * 1600 * g), 34, {fill:col, fo:.9, rx:3, op:a}));
    };
    bar(600, '8,192 tokens → 1 GiB', 1.074e9, COL.k, C[6] + 3.8, .6);
    bar(730, '131,072 tokens → 16 GiB', 17.18e9, COL.k, C[7], 1.6);
    bar(860, 'weights ≈ 16 GB', 16.06e9, COL.mute, C[7] + 2.3, 1.0);
  }
  document.getElementById('s').innerHTML = o.join('');
}
window.render = render;
const q = new URLSearchParams(location.search);
render(q.has('t') ? +q.get('t') : 0);
</script></body></html>
