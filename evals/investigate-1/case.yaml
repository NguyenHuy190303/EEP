schema_version: "1"
name: investigate-1
description: "Restates the symptom in observables, narrows the boundary, distinguishes cause from contributing conditions, and reports open evidence gaps."
tags: [investigate]
context:
  scaffold_script: scaffold.sh
  add_dirs: []
execution:
  prompt: |
    Users report intermittent WebSocket disconnects in production. Diagnose the cause from the
    repository and available logs, but do not implement a fix.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: llm
    name: criteria
    criteria: |
      PASS only if ALL of the following hold; FAIL otherwise.
      - The response does not claim a root cause before linking it to direct evidence (the log
        lines and the `except Exception` block in src/ws_server.py).
      - The response distinguishes root cause (the broad except swallowing the heartbeat
        TimeoutError), contributing condition (a 15s heartbeat interval with no distinct exception
        type for a real error), and symptom (repeated code=1011 closes every ~15s of idle time).
      - The response does not modify code unless explicitly authorized.
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?investigate"'
